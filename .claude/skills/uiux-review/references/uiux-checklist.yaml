# UI/UX チェックリスト（機械可読版）
# 解説・NG/OK例の詳細は uiux-heuristics.md を参照。
# このファイルは「何を見るか」の実行側。

meta:
  version: "2.2"
  updated: "2026-10-16"
  companion: uiux-heuristics.md
  id_convention: |
    <PREFIX>-<NN> を原則とする。A11Y-* のみ POUR の4区分を挟んで <PREFIX>-<P|O|U|R>-<NN>。
    LAW-* / STATE-* は既存の名前ベースidを維持（改番しない）。新規追加は連番。
    narrative項目（idを持たない観点）は出力時に `[narrative: 原則名]` と書き、idと区別する。
  wcag_level: |
    ref の末尾の (A)/(AA)/(AAA) はWCAG適合レベル。
    AAA項目はAA適合を目標とする案件では「違反」として報告しない（推奨として出す）。

# ---------------------------------------------------------------
# 語彙定義
# ---------------------------------------------------------------

enums:
  # requires: この項目を判定するために必要な入力
  # 複数値は OR（いずれか1つでもあれば判定を試みる）。列挙順に意味は無い。
  # 全値が揃っている場合のみ confidence: confirmed を使ってよい。一部しか無ければ最大 inferred。
  #
  # code は screenshot を部分的に代替する。レンダリングに依存しない静的な値
  # （色・寸法・文言・DOM構造）がコードから読み取れるなら、requires に code が無い項目でも
  # コードだけで判定してよい（確信度は inferred 以上）。
  # 逆に代替できないのは、実際の見え方に依存する判断（視覚的階層、余白の見た目の効き、情報量の多寡）。
  requires:
    code: HTML/CSS/JSなどの実装
    screenshot: 画面のスクリーンショットまたはデザインカンプ
    flow: 画面遷移図・フロー仕様
    runtime: 実機または動作する環境

  # auto: 将来のlintスクリプト用のメタデータ。
  # モデルは確信度の根拠に使わない（confidence は requires の充足度だけで決める）。
  auto:
    true: スクリプト/静的解析で判定可能
    false: 人またはモデルの解釈が必要

  # severity: 既定の深刻度。以下の条件でのみ1段上下させる（2段は不可）。
  #   +1: 対象が決済・削除・認証・個人情報入力のいずれかを含むフロー上にある
  #   -1: 対象が装飾要素、または管理者しか到達しない画面である
  severity:
    high: タスクを完了できない／データを失う／法令リスク
    medium: 完了できるが著しく手間・誤操作を誘発
    low: 完了に支障はないが体験を損なう

  # confidence: 出力時に必ず付与する
  confidence:
    confirmed: requires を全て満たし、入力から直接判定できた
    inferred: 一般的にそうだが入力からは断定できない（requires が一部しか無い場合を含む）
    needs_check: 判定に必要な入力が一つも無い。質問として出す

# 出力時の日本語表記: high=高, medium=中, low=低 / confirmed=確定, inferred=推定, needs_check=要確認
output_format: |
  [深刻度: 高/中/低] [確信度: 確定/推定/要確認] [id] 対象箇所
    問題: 何が起きているか
    根拠: どの入力から判断したか（該当コード行 / スクショの箇所 / 原則名）
    影響: ユーザーがどう困るか
    改善案: 具体的な変更内容

# 出力全体の構成（指摘1件の形だけでなく、全体の順序もこれに従う）
output_structure: |
  1. サマリ（3行以内。高が何件か、最優先の1件は何か）
  2. 深刻度: 高 → 中 → 低 の順（category順・id順にはしない）
  3. 要確認（別枠。質問形式）
  4. 良い点（指摘が3件以上あるときのみ1〜2件。深刻度・確信度は付けない）
  指摘が0件の場合は「指摘なし」と明記し、代わりに要確認を厚く出す。

# ---------------------------------------------------------------
# チェック項目
# ---------------------------------------------------------------

items:

  # === アクセシビリティ / 知覚可能 =============================
  - id: A11Y-P-01
    category: accessibility
    ref: WCAG 1.1.1 (A)
    check: 画像に代替テキストがある
    rule: 意味のある画像は alt を持ち、装飾画像は alt="" とする
    requires: [code]
    auto: true
    severity: high
    note: 装飾画像の alt="" 漏れだけの場合は読み上げノイズに留まるため low に落とす

  - id: A11Y-P-02
    category: accessibility
    ref: WCAG 1.4.3 (AA)
    check: テキストのコントラスト比が十分
    rule: 通常テキスト 4.5:1 以上／18pt(または14pt太字)以上は 3:1 以上
    requires: [code]
    auto: false
    severity: high
    note: >-
      比を書くなら必ず実際に計算し、根拠に採用した前景色・背景色・文字サイズを併記する。
      CSS変数・継承・opacity・グラデーション・画像背景が絡む場合は算出色が静的に決まらないため
      inferred に落とすか、レンダリング結果を要求する。大きい文字の閾値は 3:1 であり 4.5:1 で判定しない

  - id: A11Y-P-03
    category: accessibility
    ref: WCAG 1.4.11 (AA)
    check: UI部品・図形の境界のコントラストが十分
    rule: ボタン枠・入力欄枠・グラフの線は 3:1 以上
    requires: [code]
    auto: false
    severity: medium
    note: テキストのコントラストとは別に必ず走査する。対象は部品の識別に必要な境界であり、純粋な装飾の罫線は対象外

  - id: A11Y-P-04
    category: accessibility
    ref: WCAG 1.4.1 (A)
    check: 色だけで情報を伝えていない
    rule: エラー・必須・状態を色以外（アイコン/文言/形）でも示す。記号のみ（* など）も凡例が無ければ不可
    requires: [code, screenshot]
    auto: false
    severity: high

  - id: A11Y-P-05
    category: accessibility
    ref: WCAG 1.4.10 (AA)
    check: 320px幅で横スクロールなく読める
    rule: 400%ズーム相当でリフローする
    requires: [runtime, code]
    auto: false
    severity: medium

  - id: A11Y-P-06
    category: accessibility
    ref: WCAG 1.4.12 (AA)
    check: 行間・字間を変更しても崩れない
    rule: 固定高さのコンテナにテキストを詰めていない
    requires: [code]
    auto: false
    severity: low

  - id: A11Y-P-07
    category: accessibility
    ref: WCAG 1.2.2 (A)
    check: 収録済み動画に字幕がある
    rule: 対象は音声を伴う収録済みメディア。音声の無い動画は字幕ではなく 1.2.1 の代替コンテンツが要件
    requires: [code, runtime]
    auto: false
    severity: medium

  - id: A11Y-P-08
    category: accessibility
    ref: WCAG 1.2.4 (AA)
    check: ライブ配信に字幕がある
    requires: [runtime, code]
    auto: false
    severity: medium

  - id: A11Y-P-09
    category: accessibility
    ref: WCAG 1.2.1 (A)
    check: 音声のみ・映像のみの収録済みメディアに代替がある
    rule: 音声のみはテキスト書き起こし、音声の無い動画は内容を説明するテキストか音声トラック。字幕（A11Y-P-07）とは別基準
    requires: [code, screenshot]
    auto: false
    severity: medium

  # === アクセシビリティ / 操作可能 =============================
  - id: A11Y-O-01
    category: accessibility
    ref: WCAG 2.1.1 (A)
    check: キーボードのみで全機能を操作できる
    requires: [code, runtime]
    auto: false
    severity: high

  - id: A11Y-O-02
    category: accessibility
    ref: WCAG 2.4.7 (AA)
    check: フォーカスリングが視認できる
    rule: outline:none の置き去りが無い。代替の可視表現がある
    requires: [code]
    auto: true
    severity: high
    note: >-
      2.4.7 が求めるのは可視インジケータが存在することだけ。見やすさは別基準なので、
      薄い/細いリングを指摘するなら ref に 1.4.11 (AA コントラスト) を、
      サイズ・形状を問うなら 2.4.13 (AAA) を足す

  - id: A11Y-O-03
    category: accessibility
    ref: WCAG 2.4.3 (A)
    check: フォーカス順序が視覚順序と一致する
    rule: 正の tabindex を使っていない。CSSで視覚順だけ入れ替えていない。tabindex="-1" は正当なので指摘しない
    requires: [code]
    auto: true
    severity: medium

  - id: A11Y-O-04
    category: accessibility
    ref: WCAG 2.1.2 (A)
    check: 意図しないタブトラップが無い
    rule: モーダル内のトラップは正しい実装であり違反ではない。それ以外は不可
    requires: [code, runtime]
    auto: false
    severity: high

  - id: A11Y-O-05
    category: accessibility
    ref: WCAG 2.2.2 (A)
    check: 自動再生・自動スライドを停止できる
    requires: [code, runtime]
    auto: false
    severity: medium

  - id: A11Y-O-06
    category: accessibility
    ref: WCAG 2.5.8 (AA)
    check: タップ領域のサイズが十分
    rule: >-
      最小 24x24 CSS px。ただし例外があり、該当するものは指摘しない。
      Inline（文中のリンクなど、非対象テキストの line-height でサイズが決まるもの）、
      Spacing（24px未満でも、各ターゲットの中心に直径24 CSS pxの円を置いて他と交差しなければ適合）、
      Equivalent（同等の機能が別の場所にある）、User agent control、Essential
    requires: [code]
    auto: false
    severity: medium
    note: >-
      WCAG 2.2で新設。寸法の基準は4系統が併存する。
      WCAG AA = 24 CSS px / WCAG 2.5.5 (AAA) = 44 CSS px / Apple = 44pt / Material 3 = 48dp

  - id: A11Y-O-07
    category: accessibility
    ref: WCAG 2.4.11 (AA)
    check: フォーカス中の要素が固定ヘッダー等で完全には隠れない
    rule: AAでは部分的な重なりは許容される。全く隠れないことを求めるのは 2.4.12 (AAA)
    requires: [runtime, code]
    auto: false
    severity: medium
    note: WCAG 2.2で新設

  - id: A11Y-O-08
    category: accessibility
    ref: WCAG 2.5.7 (AA)
    check: ドラッグ操作に単一ポインタの代替がある
    rule: 並べ替えD&Dに「上へ／下へ」ボタン等を用意する
    requires: [code, runtime]
    auto: false
    severity: medium
    note: WCAG 2.2で新設

  - id: A11Y-O-09
    category: accessibility
    ref: WCAG 2.3.3 (AAA)
    check: prefers-reduced-motion を尊重している
    rule: >-
      SC本文は「操作で起動するモーションアニメーションを無効化できる」。prefers-reduced-motion は達成方法(C39/SCR39)。
      AAA なので AA 適合案件では「違反」ではなく推奨として出す。
      自動開始するモーションは A レベルの 2.2.2 が担当する
    requires: [code]
    auto: true
    severity: low
    note: 前庭障害のあるユーザーには健康影響があるため、大きな動きが主要導線上にある場合は medium に上げる

  - id: A11Y-O-10
    category: accessibility
    ref: WCAG 2.4.1 (A)
    check: 繰り返しコンテンツを飛ばす手段がある
    rule: スキップリンクは達成方法の一つ。ARIAランドマーク・見出し構造・iframeのtitleでも適合する
    requires: [code]
    auto: true
    severity: medium

  - id: A11Y-O-11
    category: accessibility
    ref: WCAG 2.4.6 (AA)
    check: 見出しとラベルが内容・目的を説明している
    rule: 「詳細」「その他」だけの見出しや「こちら」だけのラベルにしない。レベルの飛びは A11Y-R-01 の担当
    requires: [code, screenshot]
    auto: false
    severity: low

  - id: A11Y-O-12
    category: accessibility
    ref: WCAG 2.2.1 (A)
    check: 時間制限を解除・延長できる
    rule: セッションタイムアウト、情報や操作を含むトーストの自動消去が対象。20時間超・リアルタイム性が本質の場合は例外
    requires: [code, runtime]
    auto: false
    severity: medium
    note: undo付きトーストの消去は NOTIF-03 と重複する。トーストに限る場合は NOTIF-03 に寄せて片方のみ出す

  - id: A11Y-O-13
    category: accessibility
    ref: WCAG 2.4.12 (AAA)
    check: フォーカス中の要素が一部も隠れない
    rule: A11Y-O-07 (2.4.11) の拡張。AA目標の案件では推奨として出す
    requires: [runtime]
    auto: false
    severity: low

  - id: A11Y-O-14
    category: accessibility
    ref: WCAG 2.4.13 (AAA)
    check: フォーカスインジケータが十分な大きさとコントラストを持つ
    rule: 2 CSS px 厚の外周相当以上の面積、かつ非フォーカス時との差が 3:1 以上。AA目標の案件では推奨として出す
    requires: [code, screenshot]
    auto: false
    severity: low

  # === アクセシビリティ / 理解可能 =============================
  - id: A11Y-U-01
    category: accessibility
    ref: WCAG 3.1.1 (A)
    check: html要素に lang が指定されている
    requires: [code]
    auto: true
    severity: medium

  - id: A11Y-U-02
    category: accessibility
    ref: WCAG 1.3.1 (A) / 4.1.2 (A)
    check: 全ての入力欄がアクセシブルな名前を持つ
    rule: >-
      for/id によるプログラム的な紐付けは 1.3.1、aria-label / aria-labelledby による代替名は 4.1.2。
      3.3.2 はここではなく FORM-01（可視ラベルの提供）が担当する。
      aria-label のみの実装は 4.1.2 を満たすが 3.3.2 は満たさないので、FORM-01 も併せて判定する
    requires: [code]
    auto: true
    severity: high

  - id: A11Y-U-03
    category: accessibility
    ref: WCAG 3.3.1 (A) / 3.3.3 (AA)
    check: エラーが具体的で修正方法が分かる
    rule: 3.3.1＝エラー箇所をテキストで示す。3.3.3＝修正の示唆を出す
    requires: [code, screenshot]
    auto: false
    severity: high
    note: NN-09 と同じ事象を扱う。片方のみ出す

  - id: A11Y-U-04
    category: accessibility
    ref: WCAG 3.2.2 (A)
    check: 予期せぬ文脈変化が無い
    rule: セレクトを選んだだけで送信・遷移しない
    requires: [code, runtime]
    auto: false
    severity: medium

  - id: A11Y-U-05
    category: accessibility
    ref: WCAG 3.3.7 (A)
    check: 同じ情報を再入力させない
    rule: 配送先/請求先のコピー、前ステップの値の引き継ぎ
    requires: [flow, code]
    auto: false
    severity: medium
    note: WCAG 2.2で新設

  - id: A11Y-U-06
    category: accessibility
    ref: WCAG 3.3.8 (AA)
    check: 認証で記憶やパズルを要求しない
    rule: パスワードのペーストを禁止しない。認証コードの自動入力を妨げない（autocomplete="one-time-code" 等）
    requires: [code]
    auto: false
    severity: high
    note: WCAG 2.2で新設

  - id: A11Y-U-07
    category: accessibility
    ref: WCAG 3.2.6 (A)
    check: ヘルプの導線が、他のコンテンツに対して常に同じ相対順序で現れる
    rule: >-
      要求は「同じ位置」ではなく「相対順序が同じ」。レスポンシブで表示位置が変わっても
      順序が保たれていれば適合する。対象は問い合わせ先・問い合わせ手段・セルフヘルプ・自動応答の4種のみ
    requires: [screenshot, flow]
    auto: false
    severity: medium
    note: WCAG 2.2で新設

  - id: A11Y-U-08
    category: accessibility
    ref: WCAG 3.3.9 (AAA)
    check: 認証で物体認識・個人コンテンツの識別も要求しない
    rule: A11Y-U-06 (3.3.8) では許容される「画像から信号機を選ぶ」等の例外も無くした版。AA目標の案件では推奨として出す
    requires: [flow, runtime]
    auto: false
    severity: low

  # === アクセシビリティ / 堅牢 =================================
  - id: A11Y-R-01
    category: accessibility
    ref: ベストプラクティス（WCAG適合基準ではない）
    check: 見出しレベルが飛んでいない
    rule: >-
      WCAGは見出しレベルのスキップを禁止していない。1.3.1 は情報と関係性がプログラム的に判別可能かのみを問う。
      「h1は1つだけ」もどの達成基準にも無い。支援技術の見出しジャンプを損なう問題として出し、WCAG違反とは書かない。
      見出しが内容を説明しているかを問うなら別基準の 2.4.6 (AA) を使う
    requires: [code]
    auto: true
    severity: low

  - id: A11Y-R-02
    category: accessibility
    ref: WCAG 4.1.2 (A)
    check: セマンティックなHTMLを使っている
    rule: div+onClick ではなく button/a。ランドマーク要素を使う
    requires: [code]
    auto: true
    severity: high

  - id: A11Y-R-03
    category: accessibility
    ref: WCAG 4.1.3 (AA)
    check: 動的な変更が支援技術に伝わる
    rule: aria-live / role="status" / role="alert"
    requires: [code]
    auto: true
    severity: medium

  # === ニールセン10原則 ========================================
  - id: NN-01
    category: heuristic
    ref: Nielsen 1
    check: システムの状態が可視化されている
    rule: 非同期処理にローディング表示、完了時にフィードバック、現在地表示
    requires: [screenshot, runtime]
    auto: false
    severity: high
    note: STATE-LOADING と同じ事象を扱う。片方のみ出す

  - id: NN-02
    category: heuristic
    ref: Nielsen 2
    check: ユーザーの言葉で書かれている
    rule: 内部用語・エラーコード・英語のまま出さない
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: NN-03
    category: heuristic
    ref: Nielsen 3
    check: 取り消し・離脱の手段がある
    rule: 戻る、キャンセル、モーダルを閉じる、破壊的操作のundo
    requires: [screenshot, flow]
    auto: false
    severity: high

  - id: NN-04
    category: heuristic
    ref: Nielsen 4
    check: 配置と用語に一貫性がある
    rule: 主要アクションの位置、同義語の混在（登録/申込/サインアップ）
    requires: [screenshot, flow]
    auto: false
    severity: medium
    note: 用語の混在は TERM-01 と重複する。配置の一貫性はこちら、用語だけなら TERM-01 に寄せて片方のみ出す

  - id: NN-05
    category: heuristic
    ref: Nielsen 5
    check: そもそも誤入力できない設計になっている
    rule: 自由入力を選択式に、危険操作に確認、入力形式を事前提示
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: NN-06
    category: heuristic
    ref: Nielsen 6
    check: 記憶を要求していない
    rule: 前画面の情報を確認画面で再掲する
    requires: [flow, screenshot]
    auto: false
    severity: medium

  - id: NN-07
    category: heuristic
    ref: Nielsen 7
    check: 熟練者向けの効率化手段がある
    rule: 一括操作、ショートカット、直近入力の再利用
    requires: [screenshot, flow]
    auto: false
    severity: low

  - id: NN-08
    category: heuristic
    ref: Nielsen 8
    check: 情報量が絞られCTAが競合していない
    rule: >-
      同等の強さのプライマリボタンが複数並んでいない。
      primary と secondary が視覚的に区別されていれば並んでいても問題ない。
      片方がモーダル内など別文脈にある場合も競合ではない
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: NN-09
    category: heuristic
    ref: Nielsen 9
    check: エラーに「何が・なぜ・どうすれば」が揃っている
    requires: [screenshot, code]
    auto: false
    severity: high
    note: A11Y-U-03 と同じ事象を扱う。片方のみ出す

  - id: NN-10
    category: heuristic
    ref: Nielsen 10
    check: ヘルプが文脈内にある
    rule: 迷いやすい欄に補足。別サイトへ飛ばさない（href の向き先はコードから確認できる）
    requires: [screenshot, code]
    auto: false
    severity: low

  # === シュナイダーマン 独自分 =================================
  # SH-01/02/03/05/06/08 はニールセン10原則と重複するため NN-* に統合済み（欠番は意図的）。
  # 番号はシュナイダーマン原典の通し番号に対応する。追加時も原典番号を使う。
  - id: SH-04
    category: flow
    ref: Shneiderman 4
    check: 操作に完結感がある
    rule: ステップ表示（1/3）と完了画面がある
    requires: [flow]
    auto: false
    severity: medium

  - id: SH-07
    category: flow
    ref: Shneiderman 7
    check: 主導権がユーザーにある
    rule: 予期せぬ自動遷移、勝手な設定変更、同意なしのデフォルトONが無い
    requires: [flow, runtime]
    auto: false
    severity: high
    note: デフォルトONは DARK-01 と重複する。片方のみ出す

  # === ゲシュタルト / レイアウト（GST-05 のみノーマンのシグニファイア）=========
  - id: GST-01
    category: layout
    ref: 近接
    check: 余白でグルーピングできている
    rule: 見出しと本文の間隔 < セクション間の間隔。ラベルは自分の入力欄に近い
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: GST-02
    category: layout
    ref: 類同
    check: 同じ役割の要素が同じ見た目
    requires: [screenshot]
    auto: false
    severity: medium

  - id: GST-03
    category: layout
    ref: 連続
    check: 揃えるべき要素が揃っている
    rule: 左端・ベースラインのズレが無い
    requires: [screenshot]
    auto: false
    severity: low

  - id: GST-04
    category: layout
    ref: 図と地
    check: モーダルと背景が分離して見える
    requires: [screenshot]
    auto: false
    severity: low

  - id: GST-05
    category: layout
    ref: Norman/シグニファイア
    check: 押せる要素と単なる文字が区別できる
    requires: [screenshot]
    auto: false
    severity: medium

  - id: GST-06
    category: layout
    ref: 閉合
    check: 罫線・囲みが過剰でない
    rule: 余白と整列で表や区画が読めるなら罫線を減らす。逆に、罫線を除いたせいで行の対応が追えないなら戻す
    requires: [screenshot]
    auto: false
    severity: low

  - id: GST-07
    category: layout
    ref: 共通運命
    check: 一緒に動く要素が意味の塊と一致している
    rule: アニメーション・スクロール追従・展開で同時に動く要素が、同じグループの要素だけになっている
    requires: [runtime, screenshot]
    auto: false
    severity: low

  - id: NORM-01
    category: layout
    ref: Norman/マッピング
    check: 操作と結果の対応が空間的に分かる
    rule: 操作部品が影響対象の近く・同じ並び順にある（例：各行の操作は行内、並び替え矢印の向きと移動方向が一致）
    requires: [screenshot]
    auto: false
    severity: medium

  - id: NORM-02
    category: layout
    ref: Norman/概念モデル
    check: UIが示す動作イメージと実際の挙動が一致している
    rule: 「ゴミ箱」なら後で戻せる、「下書き」なら公開されない、等の比喩どおりに振る舞う
    requires: [flow, runtime]
    auto: false
    severity: high
    note: 「削除」が即時かつ復元不能な場合は NN-03 と重複する。比喩と挙動のずれが論点でなければ NN-03 に寄せる

  - id: NORM-03
    category: layout
    ref: Norman/制約
    check: 無効化した操作に理由が示されている
    rule: disabled にするなら押せない理由（未入力の項目名等）を近くに出すか、押させてエラーで案内する
    requires: [screenshot, code]
    auto: false
    severity: medium

  # === Laws of UX ==============================================
  - id: LAW-HICK
    category: cognition
    ref: ヒックの法則
    check: 選択肢が多すぎない
    rule: 1階層あたりの項目を絞る。プランは3つ程度が目安
    requires: [screenshot]
    auto: false
    severity: medium

  - id: LAW-MILLER
    category: cognition
    ref: ミラーの法則
    check: 情報がチャンク化されている
    rule: 桁の多い数値は区切る。長い設問はグループ化する
    requires: [screenshot]
    auto: false
    severity: low
    note: 「7±2」「4±1」の数値は諸説あるため断定しない

  - id: LAW-JAKOB
    category: cognition
    ref: ヤコブの法則
    check: 一般的な慣習に従っている
    rule: ロゴ左上でトップへ（ロゴが a でラップされているか）、カート右上、独自すぎるUIを避ける
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: LAW-PEAKEND
    category: flow
    ref: ピークエンドの法則
    check: 完了時・失敗時の体験が設計されている
    requires: [flow]
    auto: false
    severity: low

  - id: LAW-TESLER
    category: cognition
    ref: テスラーの法則
    check: 複雑さをシステム側が引き受けている
    rule: 全角半角/ハイフンの吸収、住所の自動補完
    requires: [code, runtime]
    auto: false
    severity: medium

  - id: LAW-FITTS
    category: cognition
    ref: フィッツの法則
    check: 頻用・主要なターゲットが大きく、手元に近い
    rule: 主要ボタンを小さく端に置かない。逆に破壊的操作を頻用操作の隣に大きく置かない。寸法の最小値は A11Y-O-06 の担当
    requires: [screenshot]
    auto: false
    severity: medium
    note: モバイルの親指位置が論点なら MOB-01 に寄せて片方のみ出す

  - id: LAW-SERIAL
    category: cognition
    ref: 系列位置効果
    check: 重要な項目が並びの先頭か末尾にある
    rule: ナビ・リスト・選択肢で重要度の高いものを中央に埋もれさせない
    requires: [screenshot]
    auto: false
    severity: low

  - id: LAW-AESTHETIC
    category: cognition
    ref: 美的ユーザビリティ効果
    check: 見た目の完成度の高さで使い勝手の問題を見逃していない
    rule: レビュー側の自己点検。整ったカンプでも、操作の手順数・エラー時の挙動・状態設計を必ず別に確認する
    requires: [screenshot, flow]
    auto: false
    severity: low
    note: 単独では指摘として出さない。他の項目の見落とし防止に使う

  # === UIの状態設計 ============================================
  - id: STATE-EMPTY
    category: ui_state
    check: 空状態が設計されている
    rule: 真っ白でなく、説明と次の行動を示す。初回／検索0件／片付け完了を区別する
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: STATE-LOADING
    category: ui_state
    check: 読込中の表示がある
    rule: スケルトン推奨。1秒未満の処理では逆に出さない
    requires: [code, runtime]
    auto: false
    severity: high
    note: NN-01 と同じ事象を扱う。片方のみ出す

  - id: STATE-ERROR
    category: ui_state
    check: エラー状態に再試行手段がある
    rule: 部分エラーを全画面エラーにしない
    requires: [code, runtime]
    auto: false
    severity: high

  - id: STATE-PARTIAL
    category: ui_state
    check: 部分取得時に取れた分を先に見せている
    requires: [code, runtime]
    auto: false
    severity: low

  - id: STATE-OFFLINE
    category: ui_state
    check: 通信断・権限なしの状態で入力内容を失わない
    requires: [code, runtime]
    auto: false
    severity: high

  # === フォーム ================================================
  - id: FORM-01
    category: form
    ref: WCAG 3.3.2 (A)
    check: ラベルが常時可視である
    rule: >-
      プレースホルダーをラベル代わりにしない。3.3.2 が要求するのは「全ユーザーに見える形でラベルまたは説明が提供されていること」で、
      aria-label のみの実装はこれを満たさない（プログラム的な紐付けは A11Y-U-02 が担当）。
      フローティングラベル（入力後もラベルが残る）は適合なので指摘しない
    requires: [code, screenshot]
    auto: false
    severity: high

  - id: FORM-02
    category: form
    check: モバイルで適切なキーボードが出る
    rule: inputmode / type（numeric, email, tel）が設定されている
    requires: [code]
    auto: true
    severity: medium

  - id: FORM-03
    category: form
    check: autocomplete 属性が設定されている
    rule: name, email, postal-code, cc-number 等
    requires: [code]
    auto: true
    severity: medium

  - id: FORM-04
    category: form
    check: 入力欄の幅が想定文字数と対応している
    rule: 郵便番号欄と氏名欄が同じ幅になっていない。width/size 指定がコードにあればコードだけで判定する
    requires: [screenshot, code]
    auto: false
    severity: low

  - id: FORM-05
    category: form
    check: バリデーションのタイミングが適切
    rule: 入力中に赤字を出さない。blur時または送信時。修正中の解除は可
    requires: [code, runtime]
    auto: false
    severity: medium

  - id: FORM-06
    category: form
    check: 送信時に最初のエラー欄へフォーカスが移る
    requires: [code]
    auto: false
    severity: medium

  - id: FORM-07
    category: form
    check: 必須／任意の表示が適切
    rule: 必須が多数なら任意側に印を付ける。記号だけに頼らない
    requires: [screenshot, code]
    auto: false
    severity: low

  - id: FORM-08
    category: form
    check: 二重送信を防いでいる
    rule: >-
      送信中は disabled かつ状態を表示。「送信中に」という時間軸の条件が要点なので、
      disabled={!isValid} のような入力妥当性による無効化は二重送信対策ではない。
      送信中フラグによるガードがあれば aria-disabled のみでも実質的に適合
    requires: [code]
    auto: false
    severity: high

  - id: FORM-09
    category: form
    check: 送信失敗時に入力内容が保持される
    requires: [code, runtime]
    auto: false
    severity: high

  - id: FORM-10
    category: form
    check: 長いフォームに自動保存または離脱警告がある
    requires: [code]
    auto: false
    severity: medium

  - id: FORM-11
    category: form
    check: 項目の多いフォームにエラーサマリがある
    rule: 送信時にフォーム冒頭へエラー一覧を出し、各項目へリンクする。FORM-06 のフォーカス移動と併用してよい
    requires: [code, runtime, screenshot]
    auto: false
    severity: medium

  - id: FORM-12
    category: form
    check: パスワード入力に表示切替がある
    rule: 確認用の再入力欄を求めるより、表示切替で入力内容を確かめられるようにする
    requires: [screenshot, code]
    auto: true
    severity: low

  # === マイクロコピー ==========================================
  - id: COPY-01
    category: copy
    check: ボタンが動詞＋目的語になっている
    rule: 「送信」「OK」ではなく「予約を確定する」
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: COPY-02
    category: copy
    check: ダイアログの選択肢が結果を明示している
    rule: OK/キャンセルではなく「破棄する／編集に戻る」
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: COPY-03
    category: copy
    check: 二重否定になっていない
    rule: 「通知を受け取らない ☐」を避ける
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: COPY-04
    category: copy
    check: 待ち時間の見込みが具体的
    rule: 「しばらくお待ちください」より「1分ほどかかります」
    requires: [screenshot, code]
    auto: false
    severity: low

  - id: COPY-05
    category: copy
    check: ボタンが押した結果を予告している
    rule: 「次へ」でなく「確認画面へ進む」。まだ確定しない／ここで確定する、の区別が付く
    requires: [screenshot, flow]
    auto: false
    severity: medium
    note: 動詞が無いことが論点なら COPY-01 に寄せて片方のみ出す

  - id: COPY-06
    category: copy
    check: 主語がユーザー側になっている
    rule: 「システムが処理を完了しました」でなく「保存しました」
    requires: [screenshot, code]
    auto: false
    severity: low

  - id: COPY-07
    category: copy
    check: 謝罪より次の行動を示している
    rule: 「申し訳ございません。エラーが発生しました」でなく「読み込めませんでした。[再試行]」
    requires: [screenshot, code]
    auto: false
    severity: low
    note: 次の行動の欠落自体がエラー表示の論点なら NN-09 に寄せて片方のみ出す

  # === ダークパターン ==========================================
  - id: DARK-01
    category: ethics
    check: 同意・オプションがデフォルトONになっていない
    rule: >-
      対象は同意・課金・データ利用に関わる選択肢。
      ユーザー自身の表示設定（ダークモード等）の初期値は対象外
    requires: [screenshot, code]
    auto: false
    severity: high
    note: SH-07 と同じ事象を扱う。片方のみ出す

  - id: DARK-02
    category: ethics
    check: 解約・退会の導線が登録と同程度に容易
    requires: [flow]
    auto: false
    severity: high

  - id: DARK-08
    category: ethics
    check: 無料期間の終了と課金開始を事前に告知している
    rule: 強制的な継続（無告知での自動課金）。DARK-02 の解約導線の容易さとは別の判定
    requires: [flow]
    auto: false
    severity: high

  - id: DARK-03
    category: ethics
    check: 根拠のない緊急性・希少性を演出していない
    rule: 実態のないカウントダウン、在庫表示は景表法リスク
    requires: [screenshot, code]
    auto: false
    severity: high

  - id: DARK-04
    category: ethics
    check: 断る選択肢を自虐的に書いていない
    rule: confirmshaming（「いいえ、損をしてもいい」）。文言はコードからも読める
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: DARK-05
    category: ethics
    check: 視覚的な誘導で選択肢を隠していない
    rule: 「同意しない」だけ薄いグレー、など。色・文字サイズがコードにあればコードだけで判定する
    requires: [screenshot, code]
    auto: false
    severity: high

  - id: DARK-06
    category: ethics
    check: 隠れコストが無い
    rule: 最終画面で初めて手数料が出現しない
    requires: [flow]
    auto: false
    severity: high

  - id: DARK-07
    category: ethics
    check: しつこい再要求（ナグ）が無い
    rule: 毎起動での評価依頼・通知許可の再要求
    requires: [flow, runtime]
    auto: false
    severity: medium

  # === モバイル固有 ============================================
  - id: MOB-01
    category: mobile
    check: 主要操作がサムゾーン内にある
    rule: 画面下部が押しやすい。主要導線を上部だけに置かない。破壊的操作は親指の自然位置に置かない
    requires: [screenshot]
    auto: false
    severity: medium

  - id: MOB-02
    category: mobile
    check: ソフトキーボードで入力欄・送信ボタンが隠れない
    requires: [runtime]
    auto: false
    severity: high

  - id: MOB-03
    category: mobile
    check: セーフエリアを回避している
    rule: ノッチ、ホームインジケーター、Dynamic Island
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: MOB-04
    category: mobile
    check: OSのジェスチャーと競合していない
    rule: 横スワイプのカルーセルと戻るスワイプ、プルトゥリフレッシュ
    requires: [runtime]
    auto: false
    severity: medium

  - id: MOB-05
    category: mobile
    check: hover 前提の情報表示になっていない
    requires: [code]
    auto: true
    severity: medium

  - id: MOB-06
    category: mobile
    check: 拡大縮小を禁止していない
    rule: user-scalable=no / maximum-scale=1 を使わない
    requires: [code]
    auto: true
    severity: medium

  - id: MOB-07
    category: mobile
    check: 横持ち・折りたたみ端末で破綻しない
    rule: 画面回転を固定していない（WCAG 1.3.4 は向きの固定を禁止）。折りたたみの開閉で入力内容・スクロール位置を失わない
    requires: [runtime, code]
    auto: false
    severity: medium

  - id: MOB-08
    category: mobile
    check: 低速回線でも主要タスクが完了できる
    rule: 重い画像・動画を主要操作の前に読み込ませない。タイムアウト時に再試行でき、送信の多重実行が起きない
    requires: [runtime]
    auto: false
    severity: medium
    note: 通信断で入力が消えるのは STATE-OFFLINE の担当。片方のみ出す

  # === パフォーマンス / 体感速度 ===============================
  - id: PERF-01
    category: performance
    ref: LCP
    check: 主要コンテンツの表示が速い
    threshold: 2.5秒以下
    requires: [runtime]
    auto: false
    severity: medium
    note: 実測値がない状態で速い/遅いを断定しない

  - id: PERF-02
    category: performance
    ref: INP
    check: 操作への応答が速い
    threshold: 200ms以下
    requires: [runtime]
    auto: false
    severity: medium
    note: 2024-03-12にFIDを置換。実測値がない状態で速い/遅いを断定しない

  - id: PERF-03
    category: performance
    ref: CLS
    check: 読み込み中にレイアウトがずれない
    threshold: 0.1以下（0.1ちょうどは良好に含む）
    rule: 画像・iframe・広告枠に寸法指定がある
    requires: [runtime, code]
    auto: true
    severity: high

  - id: PERF-04
    category: performance
    ref: Nielsen 応答時間の3限界
    check: 待たせ方が設計されている
    rule: 1秒未満は無表示／1-10秒はスケルトン・進捗／10秒超は完了予告と離脱可能に
    requires: [runtime]
    auto: false
    severity: medium

  - id: PERF-05
    category: performance
    check: 楽観的UIの失敗時の巻き戻しが設計されている
    requires: [code]
    auto: false
    severity: medium

  # === 情報アーキテクチャ ======================================
  - id: IA-01
    category: ia
    check: 主要機能まで3タップ以内で到達できる
    requires: [flow]
    auto: false
    severity: medium

  - id: IA-02
    category: ia
    check: 現在地が分かる
    rule: パンくず、タブのアクティブ表示
    requires: [screenshot]
    auto: false
    severity: medium

  - id: IA-03
    category: ia
    check: ナビのラベルがユーザーの語彙である
    rule: 「ソリューション」より「料金」
    requires: [screenshot, code]
    auto: false
    severity: medium

  - id: IA-04
    category: ia
    check: 404・権限エラーからの復帰導線がある
    requires: [flow]
    auto: false
    severity: medium

  - id: IA-05
    category: ia
    check: URLが状態を反映している
    rule: タブ・絞り込み条件を共有／ブックマークできる
    requires: [code, runtime]
    auto: false
    severity: medium

  - id: IA-06
    category: ia
    check: ブラウザバックで期待通りに戻る
    rule: モーダルを開いた状態で戻ると全画面離脱、になっていない
    requires: [runtime]
    auto: false
    severity: medium

  - id: IA-07
    category: ia
    check: 検索と閲覧の両方の経路がある
    rule: 項目が多いサイト・アプリで、カテゴリをたどる経路と検索の経路の片方しか無い状態を避ける
    requires: [flow, screenshot]
    auto: false
    severity: medium

  # === オンボーディング / 権限 =================================
  - id: ONB-01
    category: onboarding
    check: 権限要求の前に理由を説明している
    rule: OSダイアログをいきなり出さない
    requires: [flow]
    auto: false
    severity: high

  - id: ONB-02
    category: onboarding
    check: 権限を拒否された後の代替手段がある
    requires: [flow]
    auto: false
    severity: medium

  - id: ONB-03
    category: onboarding
    check: チュートリアルをスキップできる
    requires: [flow]
    auto: false
    severity: medium

  - id: ONB-04
    category: onboarding
    check: 登録を後回しにできる
    rule: ゲスト利用や、価値を見せてから登録を促す
    requires: [flow]
    auto: false
    severity: medium

  - id: ONB-05
    category: onboarding
    check: ツアーより文脈内で教えている
    rule: 初回の空状態や操作箇所のヒントで教える。起動時に全機能を順に説明するツアーに頼らない
    requires: [flow, screenshot]
    auto: false
    severity: low
    note: 空状態の設計自体が論点なら STATE-EMPTY に寄せて片方のみ出す

  - id: ONB-06
    category: onboarding
    check: 進捗表示が過度な圧力になっていない
    rule: プロフィール完成度等で、任意項目を必須のように見せたり、未完了を責める文言を使ったりしない
    requires: [screenshot, flow]
    auto: false
    severity: low

  # === 多言語 / 可変長 =========================================
  - id: I18N-01
    category: i18n
    check: 文字数が伸びてもレイアウトが崩れない
    rule: 日本語→英独で1.3-2倍。ボタン・カードの固定幅/高さに注意
    requires: [code, screenshot]
    auto: false
    severity: medium

  - id: I18N-02
    category: i18n
    check: 日付・通貨・住所・氏名の形式がロケール依存で組まれている
    requires: [code]
    auto: false
    severity: low

  - id: I18N-03
    category: i18n
    check: 文字列を画像に焼き込んでいない
    rule: >-
      画像の中身は入力に画像そのものが無いと判定できない。
      ファイル名やaltから文字入りバナーが疑われる場合は inferred で出す。
      装飾扱いの alt="" でも、画像内に情報があるならここに該当する
    requires: [code, screenshot]
    auto: false
    severity: medium

  - id: I18N-04
    category: i18n
    check: RTL言語への対応方針が決まっている
    rule: 対象ロケールにRTLがあるなら dir 属性と論理プロパティ（margin-inline-start 等）で組み、方向を持つアイコンを反転する
    requires: [code]
    auto: true
    severity: medium
    note: 対象ロケールにRTLが無い案件では対象外

  - id: I18N-05
    category: i18n
    check: 数値の桁区切り・小数点・単位の位置がロケールに従う
    rule: 文字列連結で組まず Intl.NumberFormat 等を使う
    requires: [code]
    auto: true
    severity: low

  # === デザイントークン ========================================
  - id: TOKEN-01
    category: design_system
    check: 色がパレット外の値になっていない
    requires: [code]
    auto: true
    severity: low

  - id: TOKEN-02
    category: design_system
    check: 余白が4pt/8ptスケールに乗っている
    requires: [code]
    auto: true
    severity: low

  - id: TOKEN-03
    category: design_system
    check: フォントサイズの種類が多すぎない
    threshold: 1画面あたり4-5種類まで
    requires: [code, screenshot]
    auto: false
    severity: low

  - id: TOKEN-04
    category: design_system
    check: 角丸・影の値が統一されている
    requires: [code]
    auto: true
    severity: low

  - id: TOKEN-05
    category: design_system
    check: 同じ意味の色が別の役割に使われていない
    rule: 成功と情報が同じ緑、など
    requires: [code, screenshot]
    auto: false
    severity: low

  # === プライバシー ============================================
  - id: PRIV-01
    category: privacy
    check: 入力途中の個人情報をクライアントに残したままにしない
    rule: 下書きの自動保存で localStorage 等に氏名・連絡先・本文を平文で置く場合、離脱・完了時に破棄する
    requires: [code]
    auto: false
    severity: medium

  - id: PRIV-02
    category: privacy
    check: 取得する情報の理由と範囲が要求時点で示されている
    requires: [screenshot, flow]
    auto: false
    severity: medium

  # === 用語の一貫性 ============================================
  - id: TERM-01
    category: consistency
    check: 同義語が混在していない
    rule: 「登録／申込／サインアップ」「削除／破棄／取り消し」。title・見出し・ナビの間のずれも対象
    requires: [code, screenshot]
    auto: false
    severity: medium
    note: NN-04 の用語部分と重複する。用語のみなら TERM-01 に寄せて片方のみ出す

  # === プラットフォームガイドライン ============================
  - id: PLAT-01
    category: platform
    ref: Apple HIG / Material Design 3
    check: 戻る操作がOS標準どおりに働く
    rule: iOSは左上の戻るとエッジスワイプ、Androidはシステムの戻る（予測型バックジェスチャー含む）。Webのブラウザバックは IA-06 の担当
    requires: [runtime]
    auto: false
    severity: high

  - id: PLAT-02
    category: platform
    ref: Apple HIG / Material Design 3
    check: 標準コンポーネントの意味を変えていない
    rule: スイッチを即時反映以外に使う、タブを画面遷移以外に使う、等をしない
    requires: [screenshot, runtime]
    auto: false
    severity: medium

  - id: PLAT-03
    category: platform
    ref: Material Design 3
    check: FABを画面の主要アクション1つに限っている
    requires: [screenshot]
    auto: false
    severity: low

  - id: PLAT-04
    category: platform
    ref: Material Design 3
    check: 重なりの階層がエレベーションで表現されている
    rule: メニュー・ダイアログ・シートが背景より上にあると分かる。ダークテーマでは影でなく面の明るさで表す
    requires: [screenshot]
    auto: false
    severity: low
    note: モーダルと背景の分離が論点なら GST-04 に寄せて片方のみ出す

  - id: PLAT-05
    category: platform
    check: ブレークポイント間の中間幅で崩れない
    rule: 定義済みブレークポイントだけでなく、その間の幅（例 768〜1024px）でも要素が重ならない・はみ出さない
    requires: [runtime, code]
    auto: false
    severity: medium

  # === テーマ（ダークモード）===================================
  - id: THEME-01
    category: theme
    check: 全テーマでコントラスト基準を満たす
    rule: ライト・ダーク・ハイコントラストのそれぞれで A11Y-P-02 / A11Y-P-03 を再計算する。片方のテーマでしか確認していない状態を避ける
    requires: [code, screenshot]
    auto: false
    severity: high

  - id: THEME-02
    category: theme
    check: OSのテーマ設定に従い、手動切替も保持される
    rule: prefers-color-scheme を初期値にし、ユーザーが切り替えた値は次回も維持する。読み込み直後に一瞬別テーマが出ない
    requires: [code, runtime]
    auto: true
    severity: low

  - id: THEME-03
    category: theme
    check: ダークテーマで画像・ロゴ・影が破綻しない
    rule: 透過PNGの黒いロゴが消える、影が見えず階層が分からない、真っ白な画像が眩しい、を避ける
    requires: [screenshot]
    auto: false
    severity: medium

  - id: THEME-04
    category: theme
    check: テーマごとに色の意味が保たれている
    rule: ダーク化で成功・警告・エラーの色相が入れ替わったり、彩度が高すぎて文字がにじんで見えたりしない
    requires: [code, screenshot]
    auto: false
    severity: low
    note: 単一テーマ内の役割の混同は TOKEN-05 の担当

  # === 通知 ====================================================
  - id: NOTIF-01
    category: notification
    check: 通知の種類ごとにオン・オフできる
    rule: 全通知の一括オン・オフしか無い状態を避ける。取引・セキュリティ通知と宣伝通知を同じスイッチにしない
    requires: [screenshot, flow]
    auto: false
    severity: medium

  - id: NOTIF-02
    category: notification
    check: 通知の頻度・タイミングが制御されている
    rule: 同種の通知をまとめる、深夜に送らない、短時間に連投しない
    requires: [flow]
    auto: false
    severity: medium
    note: 同じ依頼の繰り返し（評価依頼等）は DARK-07 の担当。片方のみ出す

  - id: NOTIF-03
    category: notification
    check: トーストに重要な情報や操作を載せたまま自動で消さない
    rule: undo・エラー・リンクを含むトーストは、ホバー/フォーカス中は消さない、または閉じるまで残す。キーボードで到達できる
    requires: [code, runtime]
    auto: false
    severity: medium

  - id: NOTIF-04
    category: notification
    check: 通知から該当箇所へ直接移動できる
    rule: 通知をタップしてトップ画面に戻されるだけ、にしない。対象が削除済みなら理由を示す
    requires: [flow, runtime]
    auto: false
    severity: medium

  # === テーブル・一覧 ==========================================
  - id: TABLE-01
    category: table
    ref: WCAG 1.3.1 (A)
    check: データ表が表として構造化されている
    rule: th と scope（または aria の grid/table）で見出しセルと列の関係を示す。レイアウト目的の table は使わない
    requires: [code]
    auto: true
    severity: medium

  - id: TABLE-02
    category: table
    check: 並べ替えの状態が分かる
    rule: どの列で昇順か降順かを見た目と aria-sort の両方で示す
    requires: [screenshot, code]
    auto: false
    severity: low

  - id: TABLE-03
    category: table
    check: 長い表・横に広い表で見出しを見失わない
    rule: 縦に長い表はヘッダー行、横に広い表は先頭列を固定する。数値列は右揃え
    requires: [screenshot, runtime]
    auto: false
    severity: low

  - id: TABLE-04
    category: table
    check: 一括操作で対象件数と範囲が分かる
    rule: 「3件選択中」を表示し、ページをまたぐ全選択なのか表示中だけなのかを区別する
    requires: [screenshot, runtime]
    auto: false
    severity: medium
    note: 一括操作の有無そのものは NN-07 の担当

  - id: TABLE-05
    category: table
    check: 絞り込み条件が見え、個別・一括で解除できる
    rule: 適用中の条件をチップ等で示す。結果0件のときは解除手段を出す（STATE-EMPTY と併せて判定）
    requires: [screenshot, runtime]
    auto: false
    severity: medium

  - id: TABLE-06
    category: table
    check: 無限スクロールでフッターや現在位置を失わない
    rule: フッターの導線に到達できる。詳細から戻ったときにスクロール位置と読込済み件数が復元される
    requires: [runtime]
    auto: false
    severity: medium

  # === データ可視化 ============================================
  - id: VIZ-01
    category: dataviz
    ref: WCAG 1.1.1 (A)
    check: グラフにテキストの代替がある
    rule: 要点の文章、またはデータ表を併置する。画像化したグラフに alt で数値を詰め込まない
    requires: [code, screenshot]
    auto: false
    severity: medium

  - id: VIZ-02
    category: dataviz
    ref: WCAG 1.4.1 (A) / 1.4.11 (AA)
    check: 系列を色だけで区別していない
    rule: 直接ラベル・線種・マーカー形状を併用する。系列の線・棒は背景に対して 3:1 以上
    requires: [screenshot, code]
    auto: false
    severity: medium
    note: グラフ以外の色依存は A11Y-P-04 の担当。グラフなら VIZ-02 に寄せて片方のみ出す

  - id: VIZ-03
    category: dataviz
    check: 軸・単位・基準が誤解を招かない
    rule: 棒グラフの軸を0から始める、単位と期間を明記する、2軸グラフで相関を誇張しない
    requires: [screenshot]
    auto: false
    severity: medium

  - id: VIZ-04
    category: dataviz
    check: 凡例との往復を最小にしている
    rule: 系列が少なければ線や棒の端に直接ラベルを置く。凡例の順序をグラフ上の並びと一致させる
    requires: [screenshot]
    auto: false
    severity: low

  # === AI機能のUI ==============================================
  - id: AI-01
    category: ai
    ref: EU AI Act 第50条
    check: AIが生成・応答していることが明示されている
    rule: チャット相手がAIであること、表示中の文章・画像がAI生成であることが分かる。人間の担当者のように見せない
    requires: [screenshot, flow]
    auto: false
    severity: high

  - id: AI-02
    category: ai
    check: 生成中の進行が見え、途中で停止できる
    rule: ストリーミング表示か段階表示で進行を示し、停止ボタンを置く。停止後に途中までの結果を残すか破棄するかが分かる
    requires: [runtime, screenshot]
    auto: false
    severity: medium
    note: 一般的な待ち時間の設計は PERF-04 の担当

  - id: AI-03
    category: ai
    check: 出力を再生成・編集・取り消しできる
    rule: 気に入らない出力をやり直せる。AIがデータを書き換える操作は、適用前にプレビューして承認するか、適用後に戻せる
    requires: [flow, runtime]
    auto: false
    severity: high

  - id: AI-04
    category: ai
    check: 出典と不確実性が示されている
    rule: 事実を述べる出力には参照元へのリンクを付ける。誤りうることを、免責文の常設ではなく確認が必要な箇所で示す
    requires: [screenshot, flow]
    auto: false
    severity: medium

  - id: AI-05
    category: ai
    check: 入力データの扱いが利用前に分かる
    rule: 入力が学習に使われるか、保存期間、オプトアウト手段を入力欄の近くか初回利用時に示す
    requires: [flow, screenshot]
    auto: false
    severity: high
    note: 個人情報の取得理由一般は PRIV-02 の担当。AI入力なら AI-05 に寄せて片方のみ出す

  - id: AI-06
    category: ai
    check: 何ができて何ができないかが分かる
    rule: 空の入力欄だけを置かず、入力例・対応範囲を示す。拒否や失敗の時は理由と代わりの手段を返す
    requires: [screenshot, runtime]
    auto: false
    severity: medium


# ---------------------------------------------------------------
# レビュー運用のルール
# ---------------------------------------------------------------

review_rules:
  - requires のいずれも手元に無い項目だけを needs_check とし、質問形式で別枠に出す
  - requires を一部しか満たさない項目は判定を試み、確信度を inferred 以下に落とす
  - 低の指摘を大量に出すより、高を数件に絞る（目安: 高3件・低は20件も出さない）
  - note に「片方のみ出す」とある重複ペアは、同じ事象から2件出さない
  - 良い点は指摘が3件以上あるときのみ1-2件挙げる。無ければ省略してよく、無理に捻り出さない
  - 意図の断定を避ける（「意図的に騙している」ではなく「該当しうる」）
  - 指摘には必ず id を添える。ref を持つ項目は原則名も併記し、ref が無い項目に原則名を捏造しない
  - AAA の達成基準は、AA 適合を目標とする案件では「違反」と書かず推奨として出す
  - コントラスト比を書くときは実際に計算し、採用した前景色・背景色・文字サイズを併記する
